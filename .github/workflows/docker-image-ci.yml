name: Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # Build the image
  build-image:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: docker build -t fasilcv/myapp:local .
      - name: save image
        run: docker save -o myapp.tar fasilcv/myapp:local

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: myapp.tar
  
  # Test jobs
  test-image:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load docker image
        run: docker load -i myapp.tar

      - name: Run docker image
        run: |
          docker run -d --name=myapp -p 8080:80 fasilcv/myapp:local
          sleep 3
      
      - name: Helath check
        run: |
          curl -f http://localhost:8080/healthz
  
  # Security scan image    
  scan-image:
    needs: build-image
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load docker image
        run: docker load -i myapp.tar
        
      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fasilcv/myapp:local'
          format: 'table'
          exit-code: '0'   #make 1 exiting code to fail the pipeline, if one of the are reported.
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

  test3:
    needs: test-image
    runs-on: ubuntu-latest
    steps:
      - run: echo "test-3"

