name: Docker CD

on:
  push:
    tags: [ 'v*.*.*' ]

env:
  VERSION: ${{ github.ref_name }}

jobs:

  # Build the image
  Build-image:
    runs-on: ubuntu-latest  
    steps:
      - uses: actions/checkout@v4

      - name: build and tag
        run: |
          docker build -t fasilcv/myapp:local .

      - name: save image
        run: docker save -o myapp.tar fasilcv/myapp:local
      
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: myapp.tar
  
  # Test the image
  Test-image:
    needs: Build-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load docker image
        run: docker load -i myapp.tar

      - name: Run docker image
        run: |
          docker run -d --name=myapp -p 8080:80 fasilcv/myapp:local
          sleep 3
      
      - name: Health check
        run: |
          curl -f http://localhost:8080/healthz

  # Security scan image    
  Scan-image:
    needs: Test-image
    runs-on: ubuntu-latest
    steps:
    
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
      - name: Load docker image
        run: docker load -i myapp.tar

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: fasilcv/myapp:local
          format: 'table'
          exit-code: '0'   #make 1 exiting code to fail the pipeline, if one of the are reported.
          #ignore-unfixed: true
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          
  # Push image
  Push-image:
    needs: Scan-image
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Load docker image
        run: docker load -i myapp.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push image
        run: |
          docker tag "fasilcv/myapp:local" "${DOCKER_USERNAME}/myapp:${VERSION}"
          docker tag "${DOCKER_USERNAME}/myapp:${VERSION}" "${DOCKER_USERNAME}/myapp:latest"
          docker push "${DOCKER_USERNAME}/myapp:${VERSION}"
          docker push "${DOCKER_USERNAME}/myapp:latest"
